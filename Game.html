<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Game - Reactor Tycoon</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background-color: #05070a; color: #ffffff; font-family: 'Courier New', Courier, monospace; overflow-x: hidden; line-height: 1.6; touch-action: manipulation; }

/* Background Grid */
.bg-grid { position: fixed; top: -40px; left: 0; width: 100vw; height: calc(100vh + 80px); pointer-events: none; z-index: -1; background: linear-gradient(rgba(0,243,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,243,255,0.03) 1px, transparent 1px); background-size: 40px 40px; animation: gridMove 3s linear infinite; }
@keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(40px); } }

/* Navigation */
.nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); background: rgba(5, 7, 10, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
.logo { font-size: 24px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 4px; display: flex; align-items: center; gap: 15px; }
.logo::before { content: ''; display: block; width: 12px; height: 12px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 10px #00ff66; }
.nav-links { display: flex; gap: 30px; flex-wrap: wrap; }
.nav-link { color: #8b949e; text-decoration: none; font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; position: relative; }
.nav-link:hover { color: #ffffff; }
.nav-active { color: #00f3ff; border-bottom: 2px solid #00f3ff; padding-bottom: 5px; }

/* Main Game Layout */
.game-wrapper { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

/* Left Side: The Core */
.core-panel { text-align: center; background: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 70%); padding: 40px 20px; border: 1px solid rgba(0, 243, 255, 0.1); position: relative; }
.energy-readout { font-size: 42px; font-weight: bold; color: #00ff66; text-shadow: 0 0 20px rgba(0, 255, 102, 0.4); margin-bottom: 5px; }
.mps-readout { font-size: 16px; color: #00f3ff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 50px; }

.reactor-btn { width: 200px; height: 200px; margin: 0 auto; border-radius: 50%; background: #0a0d14; border: 2px solid #00f3ff; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2), inset 0 0 30px rgba(0, 243, 255, 0.2); display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; transition: transform 0.05s ease; }
.reactor-btn:active { transform: scale(0.95); }
.reactor-core { width: 100px; height: 100px; background: #00f3ff; border-radius: 50%; box-shadow: 0 0 40px #00f3ff; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

/* Floating Text Animation for clicks */
.float-text { position: absolute; color: #00ff66; font-weight: bold; font-size: 20px; pointer-events: none; animation: floatUp 1s ease-out forwards; text-shadow: 0 0 10px #00ff66; z-index: 50; }
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

/* Right Side: The Upgrades */
.store-panel { display: flex; flex-direction: column; gap: 15px; }
.store-header { font-size: 20px; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; border-bottom: 1px dashed rgba(255, 255, 255, 0.2); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; }
.reset-btn { font-size: 10px; color: #ff003c; border: 1px solid #ff003c; background: transparent; padding: 4px 8px; cursor: pointer; text-transform: uppercase; }

.upgrade-item { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 243, 255, 0.2); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s ease; }
.upgrade-item:hover { background: rgba(0, 243, 255, 0.05); border-color: #00f3ff; transform: translateX(5px); }
.upgrade-item.disabled { opacity: 0.5; filter: grayscale(100%); cursor: not-allowed; transform: none; }
.upgrade-item.disabled:hover { background: rgba(0, 0, 0, 0.5); border-color: rgba(0, 243, 255, 0.2); }

.up-info { display: flex; flex-direction: column; gap: 5px; }
.up-name { font-size: 16px; font-weight: bold; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; }
.up-yield { font-size: 12px; color: #00f3ff; }
.up-cost { font-size: 14px; color: #00ff66; font-weight: bold; margin-top: 5px; }

.up-count { font-size: 24px; color: #8b949e; font-weight: 900; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 4px; }

/* Footer */
.footer { border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 0; text-align: center; color: #8b949e; font-size: 12px; margin-top: 60px; display: flex; flex-direction: column; align-items: center; gap: 15px; letter-spacing: 2px; text-transform: uppercase; }
.credit { color: #00ff66; font-size: 10px; letter-spacing: 4px; padding: 5px 15px; border: 1px dashed rgba(0, 255, 102, 0.3); background: rgba(0, 255, 102, 0.05); }

@media (max-width: 900px) {
  .game-wrapper { grid-template-columns: 1fr; }
  .nav-bar { flex-direction: column; gap: 20px; padding: 20px; text-align: center; }
  .reactor-btn { width: 160px; height: 160px; }
  .reactor-core { width: 80px; height: 80px; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>

<nav class="nav-bar">
  <div class="logo">Nuc-Metrics [IN]</div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">The Physics</a>
    <a href="timeline.html" class="nav-link">The Journey</a>
    <a href="strategy.html" class="nav-link">The Strategy</a>
    <a href="game.html" class="nav-link nav-active">The Game</a>
  </div>
</nav>

<main class="game-wrapper">
  
  <div class="core-panel">
    <div class="energy-readout" id="energyDisplay">0 MW</div>
    <div class="mps-readout" id="mpsDisplay">YIELD: 0 MW/sec</div>
    
    <div class="reactor-btn" id="clicker" onmousedown="triggerFission(event)" ontouchstart="triggerFission(event)">
      <div class="reactor-core"></div>
    </div>
    
    <div style="margin-top: 40px; font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 2px;">
      Manual Fission Yield: <span id="mpcDisplay" style="color: #00f3ff;">1 MW / Click</span>
    </div>
  </div>

  <div class="store-panel">
    <div class="store-header">
      <span>Infrastructure Deployment</span>
      <button class="reset-btn" onclick="resetGame()">Wipe Save</button>
    </div>
    
    <div id="upgradesContainer"></div>
  </div>

</main>

<footer class="footer">
  <span>Technical Platform Core // Phase 4 Additive Architecture // India Nuclear History Resource</span>
  <span class="credit">Engineered & Designed by JAGDEEP SINGH</span>
</footer>

<script>
  // Game State
  let energy = 0;
  let baseClickValue = 1;
  let mps = 0; // Megawatts per second

  // Generators Configuration
  const generators = [
    { id: 'gen1', name: 'Neutron Emitter', baseCost: 15, baseYield: 1, count: 0 },
    { id: 'gen2', name: 'Coolant Loop', baseCost: 100, baseYield: 5, count: 0 },
    { id: 'gen3', name: 'Uranium Centrifuge', baseCost: 1100, baseYield: 50, count: 0 },
    { id: 'gen4', name: 'PHWR Array', baseCost: 12000, baseYield: 400, count: 0 },
    { id: 'gen5', name: 'Thorium Breeder', baseCost: 130000, baseYield: 5000, count: 0 }
  ];

  // DOM Elements
  const energyDisplay = document.getElementById('energyDisplay');
  const mpsDisplay = document.getElementById('mpsDisplay');
  const mpcDisplay = document.getElementById('mpcDisplay');
  const upgradesContainer = document.getElementById('upgradesContainer');
  const clicker = document.getElementById('clicker');

  // Utility: Format numbers (e.g., 1,000, 1.2M)
  function formatNumber(num) {
    if (num < 1000) return Math.floor(num);
    if (num < 1000000) return (num / 1000).toFixed(1) + 'k';
    if (num < 1000000000) return (num / 1000000).toFixed(2) + 'M';
    return (num / 1000000000).toFixed(2) + 'B';
  }

  // Calculate cost scaling (cost increases by 15% each purchase)
  function getCost(baseCost, count) {
    return Math.floor(baseCost * Math.pow(1.15, count));
  }

  // Save/Load System
  function saveGame() {
    const saveData = {
      energy: energy,
      counts: generators.map(g => g.count)
    };
    localStorage.setItem('nucMetricsSave', JSON.stringify(saveData));
  }

  function loadGame() {
    const saved = localStorage.getItem('nucMetricsSave');
    if (saved) {
      const parsed = JSON.parse(saved);
      energy = parsed.energy || 0;
      parsed.counts.forEach((c, index) => {
        if(generators[index]) generators[index].count = c;
      });
    }
  }

  function resetGame() {
    if(confirm("Are you sure you want to wipe your nuclear empire? This cannot be undone.")) {
      localStorage.removeItem('nucMetricsSave');
      location.reload();
    }
  }

  // Initialization
  function initStore() {
    upgradesContainer.innerHTML = '';
    generators.forEach((gen, index) => {
      const cost = getCost(gen.baseCost, gen.count);
      
      const item = document.createElement('div');
      item.className = 'upgrade-item';
      item.id = `store-${index}`;
      item.onclick = () => buyGenerator(index);
      
      item.innerHTML = `
        <div class="up-info">
          <div class="up-name">${gen.name}</div>
          <div class="up-yield">+${formatNumber(gen.baseYield)} MW/sec</div>
          <div class="up-cost" id="cost-${index}">${formatNumber(cost)} MW</div>
        </div>
        <div class="up-count" id="count-${index}">${gen.count}</div>
      `;
      upgradesContainer.appendChild(item);
    });
  }

  function recalculateYields() {
    mps = 0;
    generators.forEach(gen => {
      mps += gen.count * gen.baseYield;
    });
    // Click value is 1% of passive generation, or 1 if generation is low
    let clickVal = Math.floor(mps * 0.01);
    baseClickValue = clickVal > 1 ? clickVal : 1;
    
    mpsDisplay.innerText = `YIELD: ${formatNumber(mps)} MW/sec`;
    mpcDisplay.innerText = `${formatNumber(baseClickValue)} MW / Click`;
  }

  // Interactions
  function triggerFission(e) {
    if(e.type === 'touchstart') e.preventDefault(); // Prevent double trigger on mobile
    
    energy += baseClickValue;
    updateUI();

    // Floating text effect
    const rect = clicker.getBoundingClientRect();
    const floatEl = document.createElement('div');
    floatEl.className = 'float-text';
    floatEl.innerText = `+${formatNumber(baseClickValue)}`;
    
    // Randomize position slightly around the clicker
    const offsetX = (Math.random() - 0.5) * 50;
    const offsetY = (Math.random() - 0.5) * 50;
    
    floatEl.style.left = (rect.width / 2) + offsetX + 'px';
    floatEl.style.top = (rect.height / 2) + offsetY + 'px';
    
    clicker.appendChild(floatEl);
    setTimeout(() => floatEl.remove(), 1000);
  }

  function buyGenerator(index) {
    const gen = generators[index];
    const cost = getCost(gen.baseCost, gen.count);
    
    if (energy >= cost) {
      energy -= cost;
      gen.count++;
      
      // Update specific DOM elements for performance
      document.getElementById(`count-${index}`).innerText = gen.count;
      document.getElementById(`cost-${index}`).innerText = formatNumber(getCost(gen.baseCost, gen.count)) + " MW";
      
      recalculateYields();
      updateUI();
      saveGame();
    }
  }

  // Update Loop
  function updateUI() {
    energyDisplay.innerText = formatNumber(energy) + " MW";
    
    // Check what the user can afford and gray out items they can't
    generators.forEach((gen, index) => {
      const el = document.getElementById(`store-${index}`);
      const cost = getCost(gen.baseCost, gen.count);
      if (energy >= cost) {
        el.classList.remove('disabled');
      } else {
        el.classList.add('disabled');
      }
    });
  }

  // Game Tick (Runs 10 times a second for smooth generation)
  setInterval(() => {
    if (mps > 0) {
      energy += mps / 10;
      updateUI();
    }
  }, 100);

  // Auto-Save every 10 seconds
  setInterval(saveGame, 10000);

  // Boot sequence
  loadGame();
  initStore();
  recalculateYields();
  updateUI();

</script>

</body>
</html>
